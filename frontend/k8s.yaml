# simple-cal 프론트엔드(nginx)를 jake-ns에 배포. backend/k8s.yaml이 먼저 적용돼 있어야 한다
# (nginx가 시작할 때 simple-cal-backend 서비스 이름을 찾는다).
# TAG_PLACEHOLDER는 이미지 빌드 시각 태그로 바꿔서 적용한다:
#   sed "s/TAG_PLACEHOLDER/$TAG/" frontend/k8s.yaml | kubectl -n jake-ns apply -f -
# 접속: kubectl -n jake-ns port-forward svc/simple-cal-frontend 8081:80 → http://localhost:8081
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-cal-frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: simple-cal-frontend }
  template:
    metadata:
      labels: { app: simple-cal-frontend }
    spec:
      containers:
        - name: frontend
          image: docker.io/library/simple-cal-frontend:TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: simple-cal-frontend
spec:
  selector: { app: simple-cal-frontend }
  ports:
    - port: 80
      targetPort: 8080
